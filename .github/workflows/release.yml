          | **Linux** | arm64 | [tar.gz](${BASE}/IRIS-cli-r5000-linux-arm64-${VER}.tar.gz) | [tar.gz](${BASE}/IRIS-cli-r5000-pcap-linux-arm64-${VER}.tar.gz) |
          | **Linux** | riscv64 †| [tar.gz](${BASE}/IRIS-cli-r5000-linux-riscv64-${VER}.tar.gz) | [tar.gz](${BASE}/IRIS-cli-r5000-pcap-linux-riscv64-${VER}.tar.gz) |

          ### chd_extract

          | Platform | Architecture | Download |
          |---|---|---|
          | **Windows** | x64 | [zip](${BASE}/IRIS-chd-windows-x64-${VER}.zip) |
          | **Windows** | arm64 | [zip](${BASE}/IRIS-chd-windows-arm64-${VER}.zip) |
          | **macOS** | Apple Silicon | [tar.gz](${BASE}/IRIS-chd-macos-arm64-${VER}.tar.gz) |
          | **macOS** | Intel | [tar.gz](${BASE}/IRIS-chd-macos-x64-${VER}.tar.gz) |
          | **Linux** | x64 | [tar.gz](${BASE}/IRIS-chd-linux-x64-${VER}.tar.gz) |
          | **Linux** | arm64 | [tar.gz](${BASE}/IRIS-chd-linux-arm64-${VER}.tar.gz) |
          | **Linux** | riscv64 †| [tar.gz](${BASE}/IRIS-chd-linux-riscv64-${VER}.tar.gz) |

          <sub>**Windows:** x64 + arm64 (Cranelift JIT requires 64-bit; 32-bit Windows is not shipped). **macOS:** requires 10.13 High Sierra or later. **Linux packages:** deb = Debian/Ubuntu, rpm = Fedora/RHEL/openSUSE, pkg = Arch/Manjaro; built against glibc 2.39 (Ubuntu 24.04). **AppImage** is self-contained and runs on most distributions. **† riscv64** is cross-compiled and shipped as a tarball only (no AppImage/deb/rpm), built against glibc 2.35. **All binaries** include \`libchdman-rs\` and are **BSD 3-Clause** licensed.</sub>

          <sub>**📡 PCAP** builds bridge the guest onto a real interface (wired connections only — many Wi-Fi APs reject the bridged MAC) and need capture privilege: **Linux** uses libpcap (bundled in the AppImage, depended on by deb/rpm, which also \`setcap\` the binary); **macOS** runs a one-time admin step (ChmodBPF) then asks you to quit & reopen; **Windows** needs the [Npcap](https://npcap.com) driver — the PCAP installer offers to download it. PCAP is opt-in (\`[network] mode = "pcap"\`); the default is NAT.</sub>

